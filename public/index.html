<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limulus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M2 10q3-6 6 0t6 0' stroke='%2341ff7c' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <script>
    // Embedded in a machine's page (?embed): compact. Escape stays the
    // editor's own (it dismisses completions). Ctrl+` is the page's key for
    // this drawer; the editor holds the keyboard while open, so pass it on.
    if (new URLSearchParams(location.search).has("embed")) {
      document.documentElement.classList.add("embedded");
      // the page's own look, when it asks (`look=paper`: the machines')
      const look = new URLSearchParams(location.search).get("look");
      if (look) document.documentElement.classList.add(look);
      if (new URLSearchParams(location.search).get("frame") === "flush") document.documentElement.classList.add("flush");
      // the page may change its mind as its regions change (Vetula's stages)
      window.addEventListener("message", (e) => {
        if (e.origin === location.origin && e.data && e.data.limulusFrame)
          document.documentElement.classList.toggle("flush", e.data.limulusFrame === "flush");
      });
      document.addEventListener("keydown", (e) => {
        if (e.ctrlKey && !e.metaKey && e.code === "Backquote") {
          e.preventDefault();
          window.parent.postMessage({ limulus: "toggle" }, location.origin);
        }
      }, true);
    }
  </script>
  <script src="./app.js?v=10"></script>
</body>
</html>
